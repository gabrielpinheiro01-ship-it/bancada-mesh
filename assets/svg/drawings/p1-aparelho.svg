<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" font-family="Atkinson Hyperlegible, Atkinson, sans-serif">
  <title>Companion de bolso pronto ligado ao celular por Bluetooth</title>
  <desc>Aparelho pronto, com bateria e rádio dentro, conversando com o celular pelo Bluetooth. O celular usa o app MeshCore. Não há fios para ligar. Se o aparelho usa antena de rosquear, nunca ligue sem a antena.</desc>

  <!-- Alerta da antena -->
  <g>
    <rect x="24" y="20" width="420" height="76" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <path d="M58 34L80 74H36Z" fill="#0F172A" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
    <text x="58" y="68" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">!</text>
    <text x="96" y="52" font-size="18" font-weight="700" fill="#0F172A">Nunca ligue sem a antena</text>
    <text x="96" y="78" font-size="15" fill="#475569">(se o seu aparelho usa antena de rosquear)</text>
  </g>

  <g data-slot="aparelho" tabindex="0" role="button" aria-label="Aparelho">
    <rect x="72" y="130" width="200" height="270" rx="28" fill="#2B3440" stroke="#0F172A" stroke-width="2"/>
    <circle cx="172" cy="158" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <circle cx="236" cy="160" r="5" fill="#94A3B8" stroke="#0F172A" stroke-width="2"/>
    <text x="172" y="252" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">Companion</text>
    <text x="172" y="278" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">de bolso</text>
    <circle cx="172" cy="350" r="16" fill="#4B5563" stroke="#0F172A" stroke-width="2"/>
    <text x="172" y="440" font-size="20" font-weight="700" text-anchor="middle" fill="#0F172A">Aparelho pronto</text>
    <text x="172" y="464" font-size="15" text-anchor="middle" fill="#475569">bateria e rádio já dentro</text>
    <rect id="hl-aparelho" x="56" y="122" width="232" height="352" rx="32" fill-opacity="0"/>
  </g>

  <!-- Bluetooth: ondas entre o aparelho e o celular -->
  <g fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round">
    <path d="M300 225A45 45 0 0 1 300 305"/>
    <path d="M318 205A70 70 0 0 1 318 325"/>
    <path d="M424 225A45 45 0 0 0 424 305"/>
    <path d="M406 205A70 70 0 0 0 406 325"/>
  </g>
  <text x="362" y="362" font-size="18" font-weight="700" text-anchor="middle" fill="#0F172A">Bluetooth</text>

  <!-- Celular -->
  <g>
    <rect x="452" y="120" width="150" height="290" rx="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <path d="M506 136H548" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <rect x="464" y="150" width="126" height="226" rx="6" fill="#E2E8F0" stroke="#0F172A" stroke-width="2"/>
    <rect x="476" y="172" width="80" height="26" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <rect x="498" y="210" width="80" height="26" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <rect x="476" y="248" width="64" height="26" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <circle cx="527" cy="392" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <text x="527" y="440" font-size="20" font-weight="700" text-anchor="middle" fill="#0F172A">Celular</text>
    <text x="527" y="464" font-size="15" text-anchor="middle" fill="#475569">com o app MeshCore</text>
  </g>

  <!-- Legenda -->
  <g font-size="16" fill="#0F172A">
    <text x="24" y="530">Sem fios para ligar: o aparelho já vem com bateria e rádio.</text>
    <text x="24" y="556">Carregue o aparelho por completo antes de começar.</text>
  </g>
</svg>
