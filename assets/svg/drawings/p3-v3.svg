<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 840" font-family="Atkinson Hyperlegible, Atkinson, sans-serif">
  <title>Ligação do repetidor na tomada com a placa Heltec V3</title>
  <desc>Fonte USB 5 V na tomada, fora da caixa. O cabo USB faz a curva para baixo, entra pelo prensa-cabo e vai na porta USB-C da placa Heltec V3. Cabo da antena: pigtail do conector IPEX (U.FL) da placa até o SMA na caixa e, se a antena ficar longe da caixa, cabo coaxial do SMA até a antena de 915 MHz.</desc>

  <!-- Caixa (fundo): prensa-cabo e respiro na parede de baixo -->
  <g data-slot="caixa" tabindex="0" role="button" aria-label="Caixa">
    <rect x="84" y="300" width="532" height="360" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <text x="100" y="330" font-size="18" font-weight="700" fill="#0F172A">Caixa</text>
    <rect x="172" y="648" width="56" height="24" rx="4" fill="#94A3B8" stroke="#0F172A" stroke-width="2"/>
    <text x="240" y="690" font-size="15" fill="#475569">prensa-cabo</text>
    <text x="240" y="720" font-size="15" fill="#475569">pingadeira (curva para baixo)</text>
    <rect x="470" y="649" width="44" height="22" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <path d="M482 654V666M492 654V666M502 654V666" fill="none" stroke="#0F172A" stroke-width="2"/>
    <text x="492" y="694" font-size="15" text-anchor="middle" fill="#475569">respiro</text>
    <rect id="hl-caixa" x="78" y="294" width="544" height="372" rx="20" fill-opacity="0"/>
  </g>

  <!-- Cabo USB da fonte até a porta USB-C (com pingadeira) -->
  <path d="M50 176V708H200V630" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="188" y="604" width="24" height="26" rx="3" fill="#475569" stroke="#0F172A" stroke-width="2"/>
  <text x="34" y="440" font-size="15" text-anchor="middle" fill="#475569" transform="rotate(-90 34 440)">cabo USB</text>

  <g data-slot="fonte" tabindex="0" role="button" aria-label="Fonte">
    <rect x="84" y="46" width="12" height="24" rx="2" fill="#94A3B8" stroke="#0F172A" stroke-width="2"/>
    <rect x="142" y="46" width="12" height="24" rx="2" fill="#94A3B8" stroke="#0F172A" stroke-width="2"/>
    <rect x="24" y="68" width="190" height="104" rx="12" fill="#E2E8F0" stroke="#0F172A" stroke-width="2"/>
    <text x="119" y="108" font-size="20" font-weight="700" text-anchor="middle" fill="#0F172A">Fonte USB 5 V</text>
    <text x="119" y="134" font-size="15" text-anchor="middle" fill="#475569">na tomada</text>
    <rect x="38" y="160" width="24" height="12" rx="2" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
    <rect id="hl-fonte" x="18" y="40" width="202" height="142" rx="14" fill-opacity="0"/>
  </g>

  <g data-slot="antena" tabindex="0" role="button" aria-label="Antena">
    <text x="548" y="70" font-size="20" font-weight="700" text-anchor="end" fill="#0F172A">Antena</text>
    <text x="548" y="94" font-size="20" font-weight="700" text-anchor="end" fill="#0F172A">915 MHz</text>
    <rect x="564" y="40" width="16" height="148" rx="8" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
    <rect x="561" y="186" width="22" height="16" rx="2" fill="#475569" stroke="#0F172A" stroke-width="2"/>
    <rect id="hl-antena" x="555" y="32" width="34" height="176" rx="8" fill-opacity="0"/>
  </g>

  <!-- Cabo da antena: pigtail do IPEX (U.FL) até o SMA (dentro da caixa) e, se a antena ficar longe, cabo coaxial do SMA até a antena -->
  <g data-slot="cabo" tabindex="0" role="button" aria-label="Cabo da antena">
    <path d="M572 202V236M572 252V286" fill="none" stroke="#0F172A" stroke-width="10"/>
    <path d="M572 203V236M572 252V285" fill="none" stroke="#B9822F" stroke-width="6"/>
    <path d="M558 241L586 231M558 257L586 247" fill="none" stroke="#0F172A" stroke-width="2"/>
    <text x="548" y="226" font-size="15" font-weight="700" text-anchor="end" fill="#0F172A">cabo coaxial até a antena</text>
    <text x="548" y="246" font-size="15" text-anchor="end" fill="#475569">(se a antena ficar longe da caixa)</text>
    <text x="548" y="266" font-size="15" text-anchor="end" fill="#475569">pode ser longo</text>
    <path d="M522 436V350H572V314" fill="none" stroke="#B9822F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="558" y="286" width="28" height="28" rx="3" fill="#B9822F" stroke="#0F172A" stroke-width="2"/>
    <text x="552" y="296" font-size="15" text-anchor="end" fill="#475569">SMA</text>
    <text x="512" y="362" font-size="15" font-weight="700" text-anchor="end" fill="#0F172A">Cabo da antena</text>
    <text x="512" y="382" font-size="15" text-anchor="end" fill="#475569">pigtail do U.FL até o SMA</text>
    <rect id="hl-cabo" x="296" y="210" width="300" height="178" rx="8" fill-opacity="0"/>
  </g>

  <g data-slot="placa" tabindex="0" role="button" aria-label="Placa">
    <rect x="148" y="420" width="400" height="180" rx="6" fill="#2B3440" stroke="#0F172A" stroke-width="2"/>
    <circle cx="522" cy="436" r="7" fill="#B9822F" stroke="#0F172A" stroke-width="2"/>
    <text x="508" y="441" font-size="15" text-anchor="end" fill="#FFFFFF">IPEX (U.FL)</text>
    <rect x="176" y="444" width="124" height="80" rx="4" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
    <text x="238" y="490" font-size="14" text-anchor="middle" fill="#CBD5E1">tela</text>
    <text x="420" y="500" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">Placa Heltec V3</text>
    <text x="420" y="524" font-size="15" text-anchor="middle" fill="#FFFFFF">versão 915 MHz</text>
    <rect x="184" y="592" width="32" height="16" rx="3" fill="#94A3B8" stroke="#0F172A" stroke-width="2"/>
    <text x="200" y="582" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">USB-C</text>
    <rect id="hl-placa" x="142" y="414" width="412" height="200" rx="10" fill-opacity="0"/>
  </g>

  <!-- Alerta da antena -->
  <g>
    <rect x="292" y="116" width="248" height="76" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <path d="M326 130L348 170H304Z" fill="#0F172A" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
    <text x="326" y="164" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">!</text>
    <text x="360" y="148" font-size="19" font-weight="700" fill="#0F172A">Nunca ligue</text>
    <text x="360" y="174" font-size="19" font-weight="700" fill="#0F172A">sem a antena</text>
    <path d="M540 154H554" fill="none" stroke="#0F172A" stroke-width="2"/>
    <path d="M554 147L563 154L554 161Z" fill="#0F172A"/>
  </g>

  <!-- Legenda -->
  <g font-size="16" fill="#0F172A">
    <text x="24" y="770">Use fonte USB 5 V de boa qualidade: fonte ruim gera ruído de rádio.</text>
    <text x="24" y="796">A fonte fica fora da caixa; só o cabo USB entra, pelo prensa-cabo.</text>
    <text x="24" y="822">Encaixe o pigtail reto no conector IPEX (U.FL), até o clique.</text>
  </g>
</svg>
